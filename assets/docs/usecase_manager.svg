<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background White -->
  <rect width="1000" height="680" fill="#ffffff"/>

  <!-- System Boundary Box -->
  <rect x="150" y="20" width="830" height="640" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="565" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Gym Manager System - Manager Use Cases</text>

  <!-- ACTOR: Manager -->
  <g id="actor_manager">
    <!-- Head -->
    <circle cx="70" cy="280" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <!-- Body -->
    <line x1="70" y1="298" x2="70" y2="350" stroke="#333333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="45" y1="315" x2="95" y2="315" stroke="#333333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="70" y1="350" x2="50" y2="400" stroke="#333333" stroke-width="2"/>
    <line x1="70" y1="350" x2="90" y2="400" stroke="#333333" stroke-width="2"/>
    <!-- Label -->
    <text x="70" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Manager</text>
  </g>

  <!-- USE CASES (OVALS) -->

  <!-- Main column -->
  <g id="uc_login" transform="translate(320, 90)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Login</text>
  </g>
  <g id="uc_dashboard" transform="translate(320, 160)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View dashboard stats</text>
  </g>
  <g id="uc_bookings" transform="translate(320, 230)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View bookings list</text>
  </g>
  <g id="uc_order_notif" transform="translate(320, 300)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View order notifications</text>
  </g>

  <!-- Manage Products -->
  <g id="uc_manage_products" transform="translate(320, 410)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Manage products</text>
  </g>
  <g id="uc_add_product" transform="translate(620, 350)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Add product</text>
  </g>
  <g id="uc_update_product" transform="translate(620, 410)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update product</text>
  </g>
  <g id="uc_delete_product" transform="translate(620, 470)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Delete product</text>
  </g>

  <!-- Manage Coaches -->
  <g id="uc_manage_coaches" transform="translate(320, 560)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Manage coaches</text>
  </g>
  <g id="uc_add_coach" transform="translate(620, 500)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Add coach</text>
  </g>
  <g id="uc_update_coach" transform="translate(620, 560)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update coach</text>
  </g>
  <g id="uc_delete_coach" transform="translate(620, 620)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Delete coach</text>
  </g>

  <!-- SOLID ASSOCIATIONS -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="95" y1="280" x2="250" y2="90"/>
    <line x1="95" y1="285" x2="235" y2="160"/>
    <line x1="95" y1="295" x2="240" y2="230"/>
    <line x1="95" y1="305" x2="230" y2="300"/>
    <line x1="95" y1="320" x2="235" y2="410"/>
    <line x1="95" y1="330" x2="235" y2="560"/>
  </g>

  <!-- DIRECTED/DASHED RELATIONSHIPS (Includes) -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <!-- Manage products -> Add product -->
    <path d="M 390 398 L 550 360" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="372" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-13, 475, 372)">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage products -> Update product -->
    <line x1="405" y1="410" x2="545" y2="410" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="402" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage products -> Delete product -->
    <path d="M 390 422 L 550 460" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="448" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(13, 475, 448)">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage coaches -> Add coach -->
    <path d="M 390 548 L 550 510" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="522" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-13, 475, 522)">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage coaches -> Update coach -->
    <line x1="405" y1="560" x2="545" y2="560" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="552" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage coaches -> Delete coach -->
    <path d="M 390 572 L 550 610" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="598" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(13, 475, 598)">&lt;&lt;include&gt;&gt;</text>
  </g>
</svg>
