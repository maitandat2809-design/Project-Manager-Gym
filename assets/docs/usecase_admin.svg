<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
    <!-- Hollow triangle arrowhead for Generalization -->
    <marker id="generalization" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background White -->
  <rect width="1000" height="680" fill="#ffffff"/>

  <!-- System Boundary Box -->
  <rect x="150" y="20" width="830" height="640" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="565" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Gym Manager System - Admin Use Cases</text>

  <!-- ACTOR 1: Admin -->
  <g id="actor_admin" transform="translate(0, -60)">
    <!-- Head -->
    <circle cx="70" cy="220" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <!-- Body -->
    <line x1="70" y1="238" x2="70" y2="290" stroke="#333333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="45" y1="255" x2="95" y2="255" stroke="#333333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="70" y1="290" x2="50" y2="340" stroke="#333333" stroke-width="2"/>
    <line x1="70" y1="290" x2="90" y2="340" stroke="#333333" stroke-width="2"/>
    <!-- Label -->
    <text x="70" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Admin</text>
  </g>

  <!-- ACTOR 2: Manager (Parent) -->
  <g id="actor_manager" transform="translate(0, 200)">
    <!-- Head -->
    <circle cx="70" cy="220" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <!-- Body -->
    <line x1="70" y1="238" x2="70" y2="290" stroke="#333333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="45" y1="255" x2="95" y2="255" stroke="#333333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="70" y1="290" x2="50" y2="340" stroke="#333333" stroke-width="2"/>
    <line x1="70" y1="290" x2="90" y2="340" stroke="#333333" stroke-width="2"/>
    <!-- Label -->
    <text x="70" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Manager</text>
  </g>

  <!-- Actor Generalization Line (Admin inherits Manager) -->
  <line x1="70" y1="315" x2="70" y2="410" stroke="#333333" stroke-width="1.8" marker-start="url(#generalization)"/>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666666" font-style="italic">Inherits</text>

  <!-- USE CASES (OVALS) -->

  <!-- Admin Exclusive Use Cases -->
  <g id="uc_admin_login" transform="translate(320, 80)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Login</text>
  </g>

  <g id="uc_user_mgmt" transform="translate(320, 190)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">User management</text>
  </g>

  <!-- User Management Details (Includes) -->
  <g id="uc_add_user" transform="translate(640, 95)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Add user</text>
  </g>
  <g id="uc_update_details" transform="translate(640, 160)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update user details</text>
  </g>
  <g id="uc_update_roles" transform="translate(640, 225)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update user roles</text>
  </g>
  <g id="uc_delete_user" transform="translate(640, 290)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Delete user</text>
  </g>

  <!-- Inherited Use Cases (Linked to Manager) -->
  <g id="uc_manage_products" transform="translate(320, 360)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Manage products</text>
  </g>
  <g id="uc_manage_coaches" transform="translate(320, 440)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Manage coaches</text>
  </g>
  <g id="uc_bookings" transform="translate(320, 520)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View bookings list</text>
  </g>
  <g id="uc_dashboard" transform="translate(320, 600)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View dashboard stats</text>
  </g>

  <!-- SOLID ASSOCIATIONS -->
  <!-- Admin Direct Associations -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="95" y1="120" x2="250" y2="80"/>
    <line x1="95" y1="130" x2="235" y2="185"/>
  </g>
  
  <!-- Manager Direct Associations -->
  <g stroke="#333333" stroke-width="1.2" opacity="0.8">
    <line x1="95" y1="440" x2="235" y2="370"/>
    <line x1="95" y1="445" x2="235" y2="440"/>
    <line x1="95" y1="455" x2="240" y2="515"/>
    <line x1="95" y1="465" x2="235" y2="590"/>
  </g>

  <!-- DIRECTED/DASHED RELATIONSHIPS (Includes) -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <!-- User management -> Add user -->
    <path d="M 395 175 L 575 110" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="495" y="132" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-18, 495, 132)">&lt;&lt;include&gt;&gt;</text>

    <!-- User management -> Update user details -->
    <path d="M 405 185 L 555 168" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="485" y="168" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-6, 485, 168)">&lt;&lt;include&gt;&gt;</text>

    <!-- User management -> Update user roles -->
    <path d="M 405 195 L 562 215" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="485" y="215" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(7, 485, 215)">&lt;&lt;include&gt;&gt;</text>

    <!-- User management -> Delete user -->
    <path d="M 395 205 L 575 270" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="495" y="248" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(18, 495, 248)">&lt;&lt;include&gt;&gt;</text>
  </g>
</svg>
