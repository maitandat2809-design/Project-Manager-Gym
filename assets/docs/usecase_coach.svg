<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background White -->
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- System Boundary Box -->
  <rect x="150" y="20" width="830" height="620" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="565" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Gym Manager System - Coach Use Cases</text>

  <!-- ACTOR: Coach -->
  <g id="actor_coach">
    <!-- Head -->
    <circle cx="70" cy="280" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <!-- Body -->
    <line x1="70" y1="298" x2="70" y2="350" stroke="#333333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="45" y1="315" x2="95" y2="315" stroke="#333333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="70" y1="350" x2="50" y2="400" stroke="#333333" stroke-width="2"/>
    <line x1="70" y1="350" x2="90" y2="400" stroke="#333333" stroke-width="2"/>
    <!-- Label -->
    <text x="70" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">Coach / PT</text>
  </g>

  <!-- USE CASES (OVALS) -->

  <!-- Main column (connected to Coach) -->
  <g id="uc_login" transform="translate(320, 90)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Login</text>
  </g>
  <g id="uc_notif" transform="translate(320, 160)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View notifications</text>
  </g>
  <g id="uc_profile" transform="translate(320, 260)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update profile</text>
  </g>
  <g id="uc_contact" transform="translate(320, 390)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update contact info</text>
  </g>
  <g id="uc_schedule" transform="translate(320, 520)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Manage schedule</text>
  </g>

  <!-- Profile details (Includes) -->
  <g id="uc_update_bio" transform="translate(620, 200)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update bio</text>
  </g>
  <g id="uc_update_specialty" transform="translate(620, 260)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update specialty</text>
  </g>
  <g id="uc_update_rate" transform="translate(620, 320)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update hourly rate</text>
  </g>

  <!-- Contact details (Includes) -->
  <g id="uc_update_zalo" transform="translate(620, 385)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update Zalo info</text>
  </g>
  <g id="uc_update_gmail" transform="translate(620, 445)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Update Gmail info</text>
  </g>

  <!-- Schedule details (Includes) -->
  <g id="uc_view_schedule" transform="translate(620, 510)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View schedule</text>
  </g>
  <g id="uc_confirm_booking" transform="translate(620, 570)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Confirm appointment</text>
  </g>

  <!-- SOLID ASSOCIATIONS (Actor to UC) -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="95" y1="280" x2="250" y2="90"/>
    <line x1="95" y1="290" x2="240" y2="160"/>
    <line x1="95" y1="300" x2="235" y2="260"/>
    <line x1="95" y1="315" x2="230" y2="390"/>
    <line x1="95" y1="330" x2="230" y2="520"/>
  </g>

  <!-- DIRECTED/DASHED RELATIONSHIPS (Includes) -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <!-- Update profile -> Update bio -->
    <path d="M 390 248 L 545 212" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="470" y="222" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-13, 470, 222)">&lt;&lt;include&gt;&gt;</text>

    <!-- Update profile -> Update specialty -->
    <line x1="405" y1="260" x2="545" y2="260" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="252" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Update profile -> Update hourly rate -->
    <path d="M 390 272 L 545 308" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="470" y="298" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(13, 470, 298)">&lt;&lt;include&gt;&gt;</text>

    <!-- Update contact -> Update Zalo -->
    <path d="M 405 388 L 545 385" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="475" y="378" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Update contact -> Update Gmail -->
    <path d="M 395 398 L 545 435" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="470" y="423" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(14, 470, 423)">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage schedule -> View schedule -->
    <path d="M 395 512 L 545 510" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="470" y="502" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Manage schedule -> Confirm appointment -->
    <path d="M 390 528 L 545 560" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="470" y="552" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(11, 470, 552)">&lt;&lt;include&gt;&gt;</text>
  </g>
</svg>
