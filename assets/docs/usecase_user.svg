<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="100%" height="100%">
  <defs>
    <!-- Arrowhead definition for directed relationships -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
    <!-- Arrowhead definition for simple association (no fill) -->
    <marker id="solidArrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 10 5 L 0 8" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background White -->
  <rect width="1000" height="660" fill="#ffffff"/>

  <!-- System Boundary Box -->
  <rect x="150" y="20" width="830" height="620" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="565" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">Gym Manager System - User Use Cases</text>

  <!-- ACTOR: User -->
  <g id="actor_user">
    <!-- Head -->
    <circle cx="70" cy="280" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <!-- Body -->
    <line x1="70" y1="298" x2="70" y2="350" stroke="#333333" stroke-width="2"/>
    <!-- Arms -->
    <line x1="45" y1="315" x2="95" y2="315" stroke="#333333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="70" y1="350" x2="50" y2="400" stroke="#333333" stroke-width="2"/>
    <line x1="70" y1="350" x2="90" y2="400" stroke="#333333" stroke-width="2"/>
    <!-- Label -->
    <text x="70" y="425" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333333" text-anchor="middle">User</text>
  </g>

  <!-- USE CASES (OVALS) -->

  <!-- Top-left column -->
  <g id="uc_view" transform="translate(320, 100)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View</text>
  </g>
  <g id="uc_register" transform="translate(320, 160)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Register</text>
  </g>
  <g id="uc_login" transform="translate(320, 220)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Login</text>
  </g>
  <g id="uc_profile" transform="translate(320, 310)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Profile management</text>
  </g>
  <g id="uc_logout" transform="translate(320, 390)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Log out</text>
  </g>

  <!-- Login sub-view -->
  <g id="uc_login_view" transform="translate(480, 220)">
    <ellipse cx="0" cy="0" rx="50" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View</text>
  </g>

  <!-- Shop flow -->
  <g id="uc_choose_product" transform="translate(680, 100)">
    <ellipse cx="0" cy="0" rx="80" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Choose product</text>
  </g>
  <g id="uc_add_to_cart" transform="translate(680, 190)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Add to cart</text>
  </g>
  <g id="uc_payment" transform="translate(680, 290)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Payment</text>
  </g>
  <g id="uc_order_confirm" transform="translate(680, 390)">
    <ellipse cx="0" cy="0" rx="85" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Order confirmation</text>
  </g>
  <g id="uc_review" transform="translate(860, 290)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Review</text>
  </g>

  <!-- Coach Appointment -->
  <g id="uc_schedule" transform="translate(420, 490)">
    <ellipse cx="0" cy="0" rx="100" ry="25" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="12" fill="#333333" text-anchor="middle">Schedule a coach appointment</text>
  </g>

  <!-- Appointment Details (Includes) -->
  <g id="uc_view_coach" transform="translate(760, 420)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">View coach</text>
  </g>
  <g id="uc_choose_coach" transform="translate(760, 490)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Choose coach</text>
  </g>
  <g id="uc_choose_time" transform="translate(760, 560)">
    <ellipse cx="0" cy="0" rx="70" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Choose time</text>
  </g>
  <g id="uc_send_email" transform="translate(480, 600)">
    <ellipse cx="0" cy="0" rx="90" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Send confirmation email</text>
  </g>

  <!-- Appointment Extends -->
  <g id="uc_cancel_schedule" transform="translate(230, 560)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">Cancel schedule</text>
  </g>
  <g id="uc_history_schedule" transform="translate(360, 600)">
    <ellipse cx="0" cy="0" rx="75" ry="22" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="13" fill="#333333" text-anchor="middle">History schedule</text>
  </g>

  <!-- SOLID ASSOCIATIONS (Actor to UC) -->
  <g stroke="#333333" stroke-width="1.2">
    <line x1="95" y1="280" x2="250" y2="100"/>
    <line x1="95" y1="290" x2="250" y2="160"/>
    <line x1="95" y1="300" x2="250" y2="220"/>
    <line x1="95" y1="315" x2="235" y2="310"/>
    <line x1="95" y1="325" x2="250" y2="390"/>
    <line x1="95" y1="340" x2="320" y2="480"/>
  </g>

  <!-- DIRECTED/DASHED RELATIONSHIPS -->
  <g stroke="#333333" stroke-width="1.2" fill="none">
    <!-- Login to View -->
    <line x1="390" y1="220" x2="430" y2="220"/>
    
    <!-- View to Choose product (Include) -->
    <path d="M 530 220 Q 600 220 620 120" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="590" y="180" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Choose product to Add to cart (Include) -->
    <line x1="680" y1="122" x2="680" y2="168" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="685" y="150" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start">&lt;&lt;include&gt;&gt;</text>

    <!-- Add to cart to Payment (Include) -->
    <line x1="680" y1="212" x2="680" y2="268" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="685" y="245" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start">&lt;&lt;include&gt;&gt;</text>

    <!-- Payment to Order confirm (Include) -->
    <line x1="680" y1="312" x2="680" y2="368" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="685" y="345" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="start">&lt;&lt;include&gt;&gt;</text>

    <!-- Review to Payment (Extend) -->
    <line x1="790" y1="290" x2="750" y2="290" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="770" y="282" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;extend&gt;&gt;</text>

    <!-- Schedule to View coach (Include) -->
    <path d="M 505 478 L 695 430" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="600" y="445" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-15, 600, 445)">&lt;&lt;include&gt;&gt;</text>

    <!-- Schedule to Choose coach (Include) -->
    <line x1="520" y1="490" x2="685" y2="490" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="600" y="482" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

    <!-- Schedule to Choose time (Include) -->
    <path d="M 505 502 L 695 548" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="600" y="535" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(15, 600, 535)">&lt;&lt;include&gt;&gt;</text>

    <!-- Schedule to Send email (Include) -->
    <path d="M 435 515 L 465 578" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="462" y="550" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(65, 462, 550)">&lt;&lt;include&gt;&gt;</text>

    <!-- Cancel schedule to Schedule (Extend) -->
    <path d="M 270 542 L 350 508" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="300" y="520" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-23, 300, 520)">&lt;&lt;extend&gt;&gt;</text>

    <!-- History schedule to Schedule (Extend) -->
    <path d="M 375 578 L 405 515" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="382" y="550" font-family="Arial, sans-serif" font-size="10" fill="#333333" text-anchor="middle" transform="rotate(-65, 382, 550)">&lt;&lt;extend&gt;&gt;</text>
  </g>
</svg>
